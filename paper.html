<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manuscript - Level 2 firebrand characterisation database description and experimental results.">
  <title>Manuscript: Firebrand Characterisation Database</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    :root {
      /* Dark Theme */
      --bg-app: #080b11;
      --bg-card: #0f131c;
      --border-color: #242f44;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #7c3aed;
      --primary-light: #a78bfa;
      --accent: #f97316;
      
      --font-title: 'Outfit', system-ui, sans-serif;
      --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-mono: 'Fira Code', monospace;
    }

    body.light-mode {
      /* Light Theme */
      --bg-app: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #6d28d9;
      --primary-light: #7c3aed;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.7;
      padding: 40px 20px;
      transition: background-color 0.25s, color 0.25s;
    }

    .container {
      max-width: 840px;
      margin: 0 auto;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 48px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      transition: all 0.2s;
    }

    .btn-back:hover {
      color: var(--text-main);
      border-color: var(--primary-light);
      background-color: rgba(124, 58, 237, 0.08);
    }

    #theme-toggle {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    #theme-toggle:hover {
      color: var(--text-main);
      border-color: var(--primary-light);
    }

    /* Article Styles */
    .article h1 {
      font-family: var(--font-title);
      font-size: 32px;
      font-weight: 800;
      line-height: 1.25;
      margin-top: 24px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--text-main) 30%, var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .article h2 {
      font-family: var(--font-title);
      font-size: 22px;
      font-weight: 700;
      margin-top: 36px;
      margin-bottom: 16px;
      border-bottom: 1.5px solid var(--border-color);
      padding-bottom: 6px;
      color: var(--primary-light);
    }

    .article h3 {
      font-family: var(--font-title);
      font-size: 18px;
      font-weight: 600;
      margin-top: 24px;
      margin-bottom: 12px;
    }

    .article p {
      margin-bottom: 20px;
      text-align: justify;
      color: var(--text-main);
      font-size: 15px;
    }

    .article ul, .article ol {
      margin-bottom: 20px;
      padding-left: 24px;
    }

    .article li {
      margin-bottom: 8px;
      font-size: 15px;
    }

    .article blockquote {
      border-left: 4px solid var(--primary);
      padding: 8px 20px;
      background-color: rgba(124, 58, 237, 0.05);
      margin: 24px 0;
      border-radius: 0 8px 8px 0;
      font-style: italic;
      color: var(--text-muted);
    }

    .article table {
      width: 100%;
      border-collapse: collapse;
      margin: 32px 0;
      font-size: 13px;
    }

    .article th {
      background-color: rgba(124, 58, 237, 0.08);
      font-weight: 700;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .article td {
      padding: 10px 16px;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .article tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.01);
    }

    .article code {
      font-family: var(--font-mono);
      background-color: rgba(0, 0, 0, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
      border: 1px solid var(--border-color);
    }

    body.light-mode .article code {
      background-color: rgba(0, 0, 0, 0.05);
    }

    .article pre {
      background-color: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 24px 0;
    }

    body.light-mode .article pre {
      background-color: #f1f5f9;
    }

    .article pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 13px;
    }

    #loading-state {
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border-color);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .container {
        padding: 24px;
      }
      .article h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body class="dark-mode">
  <div class="container">
    <header>
      <a href="index.html" class="btn-back">
        <span>←</span> Back to Database Viewer
      </a>
      <button id="theme-toggle" aria-label="Toggle Theme">
        <svg class="sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0-5c.55 0 1 .45 1 1v2c0 .55-.45 1-1 1s-1-.45-1-1V5c0-.55.45-1 1-1zm0 14c.55 0 1 .45 1 1v2c0 .55-.45 1-1 1s-1-.45-1-1v-2c0-.55.45-1 1-1zm8-7c0 .55-.45 1-1 1h-2c0-.55-.45-1-1-1s-.45-1-1-1h2c.55 0 1 .45 1 1zm-14 0c0 .55-.45 1-1 1H4c0-.55-.45-1-1-1s-.45-1-1-1h2c.55 0 1 .45 1 1zm11.66-5.66c.39.39.39 1.02 0 1.41l-1.41 1.41c-.39.39-1.02.39-1.41 0s-.39-1.02 0-1.41l1.41-1.41c.39-.39 1.02-.39 1.41 0zm-9.9 9.9c.39.39.39 1.02 0 1.41l-1.41 1.41c-.39.39-1.02.39-1.41 0s-.39-1.02 0-1.41l1.41-1.41c.39-.39 1.02-.39 1.41 0zm9.9 0c.39-.39 1.02-.39 1.41 0l1.41 1.41c.39.39.39 1.02 0 1.41l-1.41-1.41c-.39-.39-.39-1.02 0-1.41zm-9.9-9.9c.39-.39 1.02-.39 1.41 0l1.41 1.41c.39.39.39 1.02 0 1.41L4.34 6.34c-.39-.39-.39-1.02 0-1.41z"/></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display:none;"><path d="M12.3 22h-.1c-5.5 0-10-4.5-10-10 0-4.8 3.5-8.9 8.2-9.8.5-.1 1 .3.9.8-.1.5-.6.8-1.1.9-3.7.8-6.3 4.1-6.3 7.9 0 4.4 3.6 8 8 8 3.9 0 7.2-2.8 7.9-6.7.1-.5.5-.8 1-.7.5.1.8.6.7 1.1-.9 4.8-5 8.3-9.3 8.5z"/></svg>
      </button>
    </header>

    <div id="loading-state">
      <div class="spinner"></div>
      <div>Loading Manuscript and Formatting Document...</div>
    </div>

    <article id="manuscript-content" class="article" style="display: none;"></article>
  </div>

  <script>
    // Theme logic
    const themeBtn = document.getElementById('theme-toggle');
    const sunIcon = themeBtn.querySelector('.sun-icon');
    const moonIcon = themeBtn.querySelector('.moon-icon');

    function applyTheme(theme) {
      if (theme === 'light') {
        document.body.classList.remove('dark-mode');
        document.body.classList.add('light-mode');
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      } else {
        document.body.classList.remove('light-mode');
        document.body.classList.add('dark-mode');
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      }
    }

    // Initialize Theme matching database viewer preferences
    const savedTheme = localStorage.getItem('theme') || 'dark';
    applyTheme(savedTheme);

    themeBtn.addEventListener('click', () => {
      const isDark = !document.body.classList.contains('light-mode');
      const nextTheme = isDark ? 'light' : 'dark';
      applyTheme(nextTheme);
      localStorage.setItem('theme', nextTheme);
    });

    // Fetch and parse markdown
    async function loadManuscript() {
      try {
        const response = await fetch('paper.docx.md');
        if (!response.ok) {
          throw new Error('Failed to load manuscript file.');
        }
        const markdown = await response.text();
        
        // Parse markdown to HTML using marked
        const contentHtml = marked.parse(markdown);
        
        const contentDiv = document.getElementById('manuscript-content');
        contentDiv.innerHTML = contentHtml;
        
        document.getElementById('loading-state').style.display = 'none';
        contentDiv.style.display = 'block';
      } catch (error) {
        console.error(error);
        document.getElementById('loading-state').innerHTML = `
          <div style="color: #ef4444; font-weight: 600;">
            ❌ Failed to Load Manuscript
          </div>
          <p style="margin-top: 8px;">Make sure 'paper.docx.md' exists in the root directory.</p>
        `;
      }
    }

    loadManuscript();
  </script>
</body>
</html>
